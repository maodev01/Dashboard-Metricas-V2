[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
env =
    DATABASE_URL=sqlite:///./test.db
    OPENWEATHER_API_KEY=test_key
    NASA_API_KEY=DEMO_KEY