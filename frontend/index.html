<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Métricas</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    
    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .loading {
            border-top-color: #667eea;
            animation: spinner 1s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-50">
    
    <!-- Header -->
    <header class="gradient-bg text-white shadow-lg">
        <div class="container mx-auto px-4 py-6">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <i class="fas fa-chart-line text-4xl"></i>
                    <div>
                        <h1 class="text-3xl font-bold">Dashboard de Métricas</h1>
                        <p class="text-purple-200">Clima, Criptomonedas y NASA APOD</p>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <button onclick="refreshAllData()" class="bg-white text-purple-600 px-4 py-2 rounded-lg hover:bg-purple-50 transition duration-200 flex items-center space-x-2">
                        <i class="fas fa-sync-alt"></i>
                        <span>Actualizar</span>
                    </button>
                    <button onclick="collectAllData()" class="bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600 transition duration-200 flex items-center space-x-2">
                        <i class="fas fa-download"></i>
                        <span>Colectar Datos</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Stats Summary -->
    <div class="container mx-auto px-4 py-8">
        <div id="statsSection" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <!-- Stats cards will be inserted here -->
        </div>

        <!-- Date Range Selector -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-8">
            <h3 class="text-xl font-semibold mb-4 flex items-center">
                <i class="fas fa-calendar-alt text-purple-600 mr-2"></i>
                Rango de Fechas
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Fecha Inicio</label>
                    <input type="date" id="startDate" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Fecha Fin</label>
                    <input type="date" id="endDate" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                </div>
                <div class="flex items-end">
                    <button onclick="applyDateRange()" class="w-full bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700 transition duration-200 flex items-center justify-center space-x-2">
                        <i class="fas fa-search"></i>
                        <span>Buscar</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Weather Section -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-8 card-hover transition duration-300">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-2xl font-bold text-gray-800 flex items-center">
                    <i class="fas fa-cloud-sun text-blue-500 mr-3"></i>
                    Datos del Clima
                </h2>
                <div id="weatherLoading" class="hidden">
                    <div class="w-8 h-8 border-4 border-gray-200 border-t-blue-500 rounded-full loading"></div>
                </div>
            </div>
            
            <!-- Current Weather Card -->
            <div id="currentWeather" class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                <!-- Current weather data will be inserted here -->
            </div>
            
            <!-- Weather Chart -->
            <div class="bg-gray-50 rounded-lg p-4">
                <canvas id="weatherChart"></canvas>
            </div>
        </div>

        <!-- Crypto Section -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-8 card-hover transition duration-300">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-2xl font-bold text-gray-800 flex items-center">
                    <i class="fab fa-bitcoin text-yellow-500 mr-3"></i>
                    Criptomonedas
                </h2>
                <div id="cryptoLoading" class="hidden">
                    <div class="w-8 h-8 border-4 border-gray-200 border-t-yellow-500 rounded-full loading"></div>
                </div>
            </div>
            
            <!-- Crypto Cards -->
            <div id="cryptoCards" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                <!-- Crypto cards will be inserted here -->
            </div>
            
            <!-- Crypto Chart -->
            <div class="bg-gray-50 rounded-lg p-4">
                <canvas id="cryptoChart"></canvas>
            </div>
        </div>

        <!-- NASA APOD Section -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-8 card-hover transition duration-300">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-2xl font-bold text-gray-800 flex items-center">
                    <i class="fas fa-rocket text-red-500 mr-3"></i>
                    NASA - Astronomy Picture of the Day
                </h2>
                <div id="nasaLoading" class="hidden">
                    <div class="w-8 h-8 border-4 border-gray-200 border-t-red-500 rounded-full loading"></div>
                </div>
            </div>
            
            <!-- NASA APOD Content -->
            <div id="nasaContent" class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- NASA content will be inserted here -->
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-6 mt-12">
        <div class="container mx-auto px-4 text-center">
            <p class="mb-2">Dashboard de Métricas - Powered by FastAPI, Chart.js & Tailwind CSS</p>
            <p class="text-gray-400 text-sm">APIs: OpenWeatherMap, CoinGecko, NASA</p>
        </div>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
