name: CI/CD Pipeline - Dashboard de Métricas

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch: # Permitir ejecución manual

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/dashboard-metrics
  PYTHON_VERSION: '3.11'

jobs:
  # ==================== LINT ====================
  lint:
    name: Code Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pip
            ~/.cache/pre-commit
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/.pre-commit-config.yaml') }}

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install flake8 black isort pre-commit
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with flake8
        run: |
          cd backend
          # Error checking first
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Then general linting
          flake8 . --count --max-complexity=10 --max-line-length=127 --statistics

      - name: Check formatting with black
        run: |
          cd backend
          black --check --diff .

      - name: Check imports with isort
        run: |
          cd backend
          isort --check-only --diff .

  # ==================== TESTS ====================
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_metrics_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ hashFiles('**/requirements.txt') }}

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: Run tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_metrics_db
          OPENWEATHER_API_KEY: test_key
          COLLECTION_INTERVAL_MINUTES: 2
          DEBUG: True
        run: |
          cd backend
          pytest --cov=. --cov-report=xml --cov-report=term --cov-fail-under=80 -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/coverage.xml
          flags: backend
          name: backend-coverage

  # ==================== BUILD ====================
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint, test]

    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Test Backend Container
        run: |
          docker build -t test-backend ./backend
          docker run -d -p 8000:8000 --name test-backend \
            -e DATABASE_URL=sqlite:///./test.db \
            -e OPENWEATHER_API_KEY=test \
            -e COLLECTION_INTERVAL_MINUTES=2 \
            -e DEBUG=True \
            test-backend
          sleep 15
          
          # Health check with retries
          for i in {1..5}; do
            if curl -f http://localhost:8000/health; then
              echo "✅ Health check passed"
              break
            fi
            echo "⏳ Waiting for service... ($i/5)"
            sleep 5
          done
          
          docker stop test-backend
          docker rm test-backend

  # ==================== SECURITY ====================
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './backend'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Check for critical vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './backend'
          exit-code: '1'
          severity: 'CRITICAL'

  # ==================== DEPLOY TO STAGING ====================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: http://staging.your-domain.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Staging via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/dashboard-metrics-staging
            
            # Update code
            git fetch origin develop
            git reset --hard origin/develop
            
            # Create or update .env
            cat > .env << EOF
            OPENWEATHER_API_KEY=${{ secrets.OPENWEATHER_API_KEY }}
            DATABASE_URL=postgresql://metrics_user:metrics_password_2024@db:5432/metrics_db
            DEBUG=True
            COLLECTION_INTERVAL_MINUTES=2
            ALLOWED_ORIGINS=["*"]
            EOF
            
            # Deploy services
            docker-compose down
            docker-compose pull
            docker-compose up -d --build
            
            # Cleanup
            docker system prune -af --volumes

      - name: Health Check Staging
        run: |
          for i in {1..10}; do
            if curl -f http://${{ secrets.STAGING_HOST }}/health; then
              echo "✅ Staging health check passed"
              exit 0
            fi
            echo "⏳ Waiting for staging service... ($i/10)"
            sleep 10
          done
          echo "❌ Staging health check failed"
          exit 1

      - name: Notify Slack - Staging
        if: always()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "Staging Deployment ${{ job.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "🚀 *Staging Deployment*\n*Status:* ${{ job.status }}\n*Branch:* develop\n*Commit:* ${{ github.sha }}\n*Environment:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                }
              ]
            }

  # ==================== DEPLOY TO PRODUCTION ====================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, security, deploy-staging]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://your-domain.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment
        uses: chrnorm/deployment-action@v2
        id: deployment
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: production
          ref: ${{ github.sha }}

      - name: Deploy to Production via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/dashboard-metrics
            
            # Backup database
            timestamp=$(date +%Y%m%d_%H%M%S)
            docker-compose exec -T db pg_dump -U metrics_user metrics_db > backup_$timestamp.sql
            gzip backup_$timestamp.sql
            
            # Update code
            git fetch origin main
            git reset --hard origin/main
            
            # Update environment file
            cat > .env << EOF
            OPENWEATHER_API_KEY=${{ secrets.OPENWEATHER_API_KEY }}
            DATABASE_URL=postgresql://metrics_user:metrics_password_2024@db:5432/metrics_db
            DEBUG=False
            COLLECTION_INTERVAL_MINUTES=2
            ALLOWED_ORIGINS=["https://your-domain.com"]
            LOG_LEVEL=INFO
            EOF
            
            # Zero-downtime deployment
            docker-compose pull
            docker-compose up -d --build --no-deps backend
            sleep 15
            docker-compose up -d --no-deps frontend
            
            # Cleanup
            docker system prune -af --volumes
            
            # Keep only last 7 backups
            ls -t backup_*.sql.gz | tail -n +8 | xargs -r rm

      - name: Health Check Production
        run: |
          for i in {1..10}; do
            if curl -f https://your-domain.com/health; then
              echo "✅ Production health check passed"
              exit 0
            fi
            echo "⏳ Waiting for production service... ($i/10)"
            sleep 10
          done
          echo "❌ Production health check failed"
          exit 1

      - name: Update deployment status (success)
        if: success()
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: 'success'
          environment-url: https://your-domain.com

      - name: Update deployment status (failure)
        if: failure()
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: 'failure'

      - name: Notify Slack - Production
        if: always()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "Production Deployment ${{ job.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "🚀 *Production Deployment*\n*Status:* ${{ job.status }}\n*Version:* ${{ github.sha }}\n*Environment:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n*URL:* https://your-domain.com"
                  }
                }
              ]
            }

  # ==================== ROLLBACK ====================
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: production

    steps:
      - name: Rollback via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/dashboard-metrics
            
            # Revert to previous commit
            current_commit=$(git rev-parse --short HEAD)
            git checkout HEAD~1
            previous_commit=$(git rev-parse --short HEAD)
            
            echo "Rolling back from $current_commit to $previous_commit"
            
            # Restart services
            docker-compose down
            docker-compose up -d --build
            
            echo "✅ Rollback completado de $current_commit a $previous_commit"

      - name: Notify Slack - Rollback
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "⚠️ Rollback ejecutado en producción",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "⚠️ *Rollback en Producción*\nSe ha ejecutado un rollback manual en el entorno de producción.\n*Ejecutado por:* ${{ github.actor }}\n*Workflow:* ${{ github.workflow }}"
                  }
                }
              ]
            }

  # ==================== PERFORMANCE TESTS ====================
  performance:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: deploy-production
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v9
        with:
          urls: |
            https://your-domain.com
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Load Test with k6
        uses: grafana/k6-action@v0.3.0
        with:
          filename: tests/load-test.js
        env:
          K6_CLOUD_TOKEN: ${{ secrets.K6_CLOUD_TOKEN }}